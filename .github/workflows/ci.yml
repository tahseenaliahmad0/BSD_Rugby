name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rugby
          POSTGRES_PASSWORD: rugby
          POSTGRES_DB: rugby
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rugby" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+pg8000://rugby:rugby@localhost:5432/rugby_test
      E2E_DATABASE_URL: postgresql+pg8000://rugby:rugby@localhost:5432/rugby_e2e
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Create test databases
        run: |
          PGPASSWORD=rugby psql -h localhost -U rugby -d rugby -c "CREATE DATABASE rugby_test"
          PGPASSWORD=rugby psql -h localhost -U rugby -d rugby -c "CREATE DATABASE rugby_e2e"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make setup

      - name: Lint, format and type checks
        run: make check

      - name: Backend and frontend unit tests
        run: make test

      - name: Install Google Chrome for Playwright (Playwright's Chromium cannot decode H.264)
        working-directory: frontend
        run: npx playwright install --with-deps chrome

      - name: Playwright smoke test
        run: make e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build backend
      - name: Build Caddy + frontend image
        run: docker build -f deploy/caddy/Dockerfile .
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/deploy/caddy/tls.dev.caddy:/etc/caddy/tls.caddy:ro" \
            -e "SITE_ADDRESSES=example.edu, localhost, 127.0.0.1" -e HTTP_PORT=8080 -e HTTPS_PORT=8443 \
            -e API_UPSTREAM=127.0.0.1:8000 -e MEDIA_ROOT=/srv/media \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config -q
          SITE_ADDRESS=example.edu DATA_DIR=/tmp/rugby CERTS_DIR=/tmp/certs \
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config -q

  apptainer-build:
    # The college server runs Apptainer, not Docker: build the same images from the def files.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6
      - name: Build the four images
        run: |
          mkdir -p deploy/apptainer/build
          git archive HEAD backend frontend | tar -x -C deploy/apptainer/build
          rm -rf deploy/apptainer/build/backend/tests
          cd deploy/apptainer
          sudo apptainer build --force postgres.sif postgres.def
          sudo apptainer build --force redis.sif redis.def
          sudo apptainer build --force backend.sif backend.def
          sudo apptainer build --force caddy.sif caddy.def
          ls -la *.sif
      - name: Smoke test the backend image
        run: |
          cd deploy/apptainer
          apptainer exec backend.sif python -c "import app.main; print('backend image ok')"
          apptainer exec backend.sif ffmpeg -version | head -1
          apptainer exec caddy.sif caddy version
          apptainer exec caddy.sif test -f /srv/index.html
          apptainer exec --env "SITE_ADDRESSES=example.edu, localhost, 127.0.0.1" --env HTTP_PORT=8080 --env HTTPS_PORT=8443 \
            --env API_UPSTREAM=127.0.0.1:8000 --env MEDIA_ROOT=/srv/media \
            caddy.sif caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
